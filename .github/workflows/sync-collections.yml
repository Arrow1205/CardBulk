name: Sync Collections depuis Beckett Soccer

on:
  schedule:
    # Tous les vendredis à 9h00 UTC
    - cron: '0 9 * * 5'

  # Déclenchement manuel depuis GitHub Actions
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de lancement'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal   # nouvelles collections cette semaine seulement
          - all      # retraiter toutes les collections Beckett (--all)
          - init     # juste initialiser les slugs existants sans traiter (--init)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write  # Nécessaire pour git push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Init automatique si c'est la 1re exécution, ou si mode=init
      - name: Init / Premier lancement
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          TRACKED="data/collections/_tracked_slugs.json"
          SIZE=$(wc -c < "$TRACKED" 2>/dev/null || echo 0)
          MODE="${{ github.event.inputs.mode }}"

          if [ "$MODE" = "init" ]; then
            echo "📋 Mode init manuel"
            node scripts/sync-collections.js --init
          elif [ "$SIZE" -lt 10 ] && [ "$MODE" != "all" ]; then
            echo "📋 Premier lancement — init des slugs Beckett"
            node scripts/sync-collections.js --init
          else
            echo "✓ Déjà initialisé ($SIZE octets)"
          fi

      - name: Synchronisation
        if: ${{ github.event.inputs.mode != 'init' }}
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "all" ]; then
            echo "🔁 Mode --all : retraitement complet"
            node scripts/sync-collections.js --all
          else
            node scripts/sync-collections.js
          fi

      - name: Vérifier les changements
        id: check_changes
        run: |
          git diff --quiet data/collections/ data/sets.json \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true"  >> $GITHUB_OUTPUT

      - name: Commit et push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/collections/ data/sets.json
          git status --short
          git commit -m "chore: sync nouvelles collections depuis Beckett [skip ci]"
          git push
          echo "✅ Collections poussées → Vercel redéploie automatiquement"

      - name: Aucun changement
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "✅ Aucune nouvelle collection cette semaine."
